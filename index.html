<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano Tiles Ultimate — Matías</title>
<style>
/* Variables y colores */
:root {
  --bg-gradient: linear-gradient(120deg,#071127,#0b2140,#1a2a6c);
  --tile-base: #42E695;
  --tile-hit: #FF3CAC;
  --hud-bg: rgba(255,255,255,0.05);
  --hud-text: #cfeff7;
}

/* BODY y fondo animado */
body {
  margin:0;
  font-family: Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background: linear-gradient(270deg,#071127,#0b2140,#1a2be2,#FF3CAC);
  background-size: 400% 400%;
  animation: gradientShift 30s ease infinite;
  color:#fff;
}
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Contenedor del juego */
#gameContainer {
  position: relative;
  width: 400px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 40px #8A2BE2, 0 0 80px #FF3CAC;
  transition: all 0.3s ease;
}
#gameContainer:hover {
  box-shadow: 0 0 50px #FF3CAC, 0 0 100px #8A2BE2;
}

/* Canvas del tablero */
canvas {
  display: block;
  width: 100%;
  height: 600px;
  border-radius: 12px;
  background: linear-gradient(180deg,#0a0f1a,#07102a);
  border: 6px solid #8A2BE2;
  box-shadow: 0 0 25px #FF3CAC, 0 0 50px #8A2BE2;
  transition: all 0.3s ease;
}

/* Glow al hacer click o hover */
canvas:hover {
  box-shadow: 0 0 30px #42E695, 0 0 60px #FF3CAC, inset 0 0 15px #42E695;
}
canvas:active {
  box-shadow: 0 0 40px #FF3CAC, 0 0 80px #8A2BE2, inset 0 0 20px #FFD700;
  transform: scale(1.02);
}

/* HUD */
.hud {
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:14px;
}
.hud div {
  background: var(--hud-bg);
  padding: 8px 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 0 10px rgba(255,255,255,0.3);
  text-shadow: 0 0 5px #fff, 0 0 10px #42E695;
  font-weight: bold;
  font-family: 'Orbitron', sans-serif;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: all 0.3s ease;
  animation: pulseHUD 3s infinite alternate;
}
.hud div:hover {
  box-shadow: 0 0 15px #FF3CAC, 0 0 25px #8A2BE2;
  transform: scale(1.05);
}
@keyframes pulseHUD {
  0% { box-shadow: 0 0 10px rgba(255,255,255,0.3); }
  50% { box-shadow: 0 0 20px #42E695, 0 0 30px #FF3CAC; }
  100% { box-shadow: 0 0 10px rgba(255,255,255,0.3); }
}

/* Botones */
#controls {
  margin-top:10px;
  display:flex;
  justify-content:space-between;
}
button {
  padding:10px 16px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  background: linear-gradient(45deg,#00e676,#00bfa5);
  color:#02241a;
  transition: all 0.3s ease;
  box-shadow: 0 0 10px #00e676, 0 0 20px #00bfa5;
}
button:hover {
  background: linear-gradient(45deg,#FF3CAC,#8A2BE2);
  box-shadow: 0 0 15px #FF3CAC, 0 0 25px #8A2BE2;
  transform: scale(1.1);
}
button:active {
  transform: scale(0.95);
  box-shadow: 0 0 5px #FF3CAC, 0 0 10px #8A2BE2 inset;
}

/* Vibración */
.hud div:active, button:active {
  animation: shake 0.2s;
}
@keyframes shake {
  0% { transform: translate(0,0); }
  25% { transform: translate(2px,-2px); }
  50% { transform: translate(-2px,2px); }
  75% { transform: translate(2px,2px); }
  100% { transform: translate(0,0); }
}

/* Ajustes para móviles */
@media (max-width: 480px) {
  #gameContainer { width: 90vw; }
  canvas { height: 400px; border-width:4px; border-radius:8px; }
  .hud { font-size:12px; }
  .hud div { padding:6px 10px; border-radius:8px; }
  button { padding:8px 12px; font-size:14px; border-radius:8px; }
}
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <div class="hud">
    <div>Jugador: <span id="hudName">Invitado</span></div>
    <div>Puntos: <span id="hudScore">0</span></div>
    <div>Nivel: <span id="hudLvl">1</span></div>
  </div>
  <div id="controls">
    <button id="btnStart">▶ Jugar</button>
    <button id="btnRestart">🔄 Reiniciar</button>
  </div>
</div>

<audio id="gameSong" src="song.mp3" preload="auto"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const hudScore = document.getElementById('hudScore');
const hudLvl = document.getElementById('hudLvl');
const btnStart = document.getElementById('btnStart');
const btnRestart = document.getElementById('btnRestart');
const gameSong = document.getElementById('gameSong');

const BPM = 118;
const intervalo = (60 / BPM) * 1000;

let tiles = [];
let particles = [];
let score = 0;
let level = 1;
let speed = 1;
let running = false;
const cols = 4;
let tileW = canvas.width / cols;
let tileH = 150;

let spawnInterval;
let speedInterval;

// Map de teclas
const keyMap = { '1':0, '2':1, '3':2, '4':3 };

// Colores con gradiente
const colors = [
  {start:'#FF3CAC', end:'#FFB5D8'},
  {start:'#2B86C5', end:'#8CD0FF'},
  {start:'#42E695', end:'#3BB2B8'},
  {start:'#FFAA00', end:'#FFD166'},
  {start:'#FF1B6B', end:'#FF4D9C'},
  {start:'#8A2BE2', end:'#C08EFF'},
  {start:'#00C2FF', end:'#67F0FF'}
];

// Crear un nuevo tile
function spawnTile() {
  const col = Math.floor(Math.random() * cols);
  tiles.push({ x: col * tileW, y: -tileH, w: tileW, h: tileH, hit: false });
}

// Tile activo más cercano al borde inferior
function getActiveTile() {
  if (tiles.length === 0) return null;
  return tiles.reduce((prev, curr) => prev.y > curr.y ? prev : curr);
}

// Crear partículas al golpear
function spawnParticles(tile) {
  for (let i = 0; i < 15; i++) {
    particles.push({
      x: tile.x + tile.w/2,
      y: tile.y + tile.h/2,
      vx: (Math.random()-0.5)*4,
      vy: (Math.random()-0.5)*4,
      alpha: 1,
      color: colors[Math.floor(Math.random()*colors.length)].end,
      size: Math.random()*5+2
    });
  }
}

// Dibujar partículas
function drawParticles() {
  particles.forEach((p, i) => {
    ctx.fillStyle = `rgba(${hexToRgb(p.color)},${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.03;
    if (p.alpha <= 0) particles.splice(i,1);
  });
}

// Convierte hex a rgb
function hexToRgb(hex){
  hex = hex.replace('#','');
  const r = parseInt(hex.substring(0,2),16);
  const g = parseInt(hex.substring(2,4),16);
  const b = parseInt(hex.substring(4,6),16);
  return `${r},${g},${b}`;
}

// Dibujar tiles
function drawTiles() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const activeTile = getActiveTile();

  tiles.forEach(t => {
    const colorIdx = Math.min(Math.floor(speed - 1), colors.length - 1);
    const gradient = ctx.createLinearGradient(t.x, t.y, t.x + t.w, t.y + t.h);
    gradient.addColorStop(0, colors[colorIdx].start);
    gradient.addColorStop(1, colors[colorIdx].end);

    ctx.fillStyle = t.hit ? '#555' : (t === activeTile ? '#FFD700' : gradient);
    ctx.fillRect(t.x + 4, t.y + 4, t.w - 8, t.h - 8);

    // Efecto rastro en tile activo
    if(t === activeTile && !t.hit){
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(t.x + 4, t.y, t.w - 8, t.h);
    }

    // Borde con sombra
    ctx.strokeStyle = t.hit ? '#AAA' : (t === activeTile ? '#fff' : '#333');
    ctx.lineWidth = t === activeTile ? 4 : 2;
    ctx.shadowColor = t === activeTile ? '#FFD700' : '#000';
    ctx.shadowBlur = t === activeTile ? 15 : 3;
    ctx.strokeRect(t.x + 4, t.y + 4, t.w - 8, t.h - 8);
    ctx.shadowBlur = 0;
  });

  drawParticles();

  // Números de columna
  ctx.fillStyle = 'white';
  ctx.font = '25px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  for (let i = 0; i < cols; i++) {
    ctx.fillText(i + 1, i * tileW + tileW/2, canvas.height - 10);
  }
}

// Actualizar juego
function update() {
  if(!running) return;

  tiles.forEach((tile,i)=>{
    tile.y += 2*speed;
    if(tile.y + tile.h >= canvas.height && !tile.hit){
      gameOver();
      return;
    }
  });

  drawTiles();
  hudScore.textContent = score;
  hudLvl.textContent = level;

  requestAnimationFrame(update);
}

// Golpear un tile
function hitTile(tile){
  tile.hit = true;
  spawnParticles(tile);
  tiles.splice(tiles.indexOf(tile),1);
  score += 10;
  level = 1 + Math.floor(score/50);
  // Sonido por tile (si tienes hit.mp3)
  // new Audio('hit.mp3').play();
}

// Click
canvas.addEventListener('click',(e)=>{
  if(!running) return;
  const activeTile = getActiveTile();
  if(!activeTile) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  if(x < activeTile.x || x > activeTile.x+activeTile.w || y < activeTile.y || y > activeTile.y+activeTile.h){
    gameOver();
    return;
  }
  hitTile(activeTile);
});

// Teclado
document.addEventListener('keydown',(e)=>{
  if(!running) return;
  const col = keyMap[e.key];
  if(col === undefined) return;
  const activeTile = getActiveTile();
  if(!activeTile) return;
  if(activeTile.x / tileW !== col){
    gameOver();
    return;
  }
  hitTile(activeTile);
});

// Game Over
function gameOver(){
  running = false;
  clearInterval(spawnInterval);
  clearInterval(speedInterval);
  gameSong.pause();
  alert(`Game Over! Puntos: ${score}`);
}

// Iniciar juego
function startGame(){
  clearInterval(spawnInterval);
  clearInterval(speedInterval);
  tiles=[];
  particles=[];
  score=0;
  level=1;
  speed=1;
  running=true;
  gameSong.currentTime=0;
  gameSong.play();

  spawnInterval = setInterval(spawnTile, intervalo);
  speedInterval = setInterval(()=>{ if(running){ speed+=0.02; level++; } },5000);
  update();
}

// Botones
btnStart.addEventListener('click', startGame);
btnRestart.addEventListener('click', ()=>{
  running=false;
  clearInterval(spawnInterval);
  clearInterval(speedInterval);
  startGame();
});

// Ajuste para móvil
function resizeTiles(){
  tileW = canvas.width/cols;
  tileH = canvas.height/4;
}
window.addEventListener('resize', resizeTiles);
resizeTiles();
</script>



</body>
</html>
